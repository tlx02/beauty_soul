[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beauty_soul"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "Pillow>=10.0",
    "requests>=2.31",
    # HTTP service entry (beauty_soul.server:app) for the KiX integration — see §3 of
    # the HTTP interface spec. Run: uvicorn beauty_soul.server:app --host 0.0.0.0 --port 9102
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # playwright>=1.40 required for visual audit (Pass 4.5) and smoke test (Pass 6).
    # Install separately: pip install playwright && python -m playwright install chromium
    # Both passes degrade gracefully when Playwright is unavailable (logged as skipped).
    # rembg is NOT required — background removal was removed; only transparent-padding
    # crop (Pillow only) is used. See beauty_soul/beautify_games.py _crop_transparent_padding.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]  # httpx powers FastAPI TestClient
browser = ["playwright>=1.40"]

[project.scripts]
beauty-soul = "cli:main"

[tool.setuptools.packages.find]
include = ["beauty_soul*"]
